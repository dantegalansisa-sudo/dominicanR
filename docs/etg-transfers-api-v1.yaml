          minLength: 1
          type: string
          description: Status of the order (completed or cancelled)
        order_id:
          minLength: 1
          type: string
          description: ID of the order in the personal account of the supplier
        start_time:
          minLength: 1
          type: string
          description: Date and time of departure in RFC3339 with timezone of departure
        price:
          $ref: '#/components/schemas/inline_response_200_1_price'
        driver_info:
          $ref: '#/components/schemas/inline_response_200_2_driver_info'
        car_info:
          $ref: '#/components/schemas/inline_response_200_2_car_info'
        meeting_info:
          $ref: '#/components/schemas/meeting_info'
        main_passenger:
          $ref: '#/components/schemas/status_main_passenger'
        included_waiting_time_minutes:
          type: integer
          description: free waiting time for the transfer. Number in minutes
        buffer_time_minutes:
          type: interger
          description: buffer time is the time between the moment the aircraft lands and the start of the transfer waiting time. Number in minutes
        passengers:
          type: integer
          description: how many passengers are selected
        luggage_places:
          type: integer
          description: how many luggage places are selected
        sport_luggage_places:
          type: integer
          description: how many sport luggage places are selected
        animals:
          type: integer
          description: how many animals are selected
        comment:
          type: string
          description: Fields for entering free-form travel wishes from a passenger. Different languages
        shield_text:
          type: string
          description: name on the meeting plate. Different languages
        transfer_category:
          $ref: '#/components/schemas/transfer_category'
        free_cancel_until:
          minLength: 1
          type: string
          description: 'date when free cancellation ends, example: 2021-11-17T14:09:56.459738+03:00 with TIMEZONE RFC3339. Date in travel time zone'
      required:
        - status
        - order_id
        - start_time
        - price
    status_main_passenger:
      type: object
      description: Passenger data model
      properties:
        first_name:
          minLength: 1
          type: string
          description: first name in English
        last_name:
          minLength: 1
          type: string
          description: last name in English
        phone:
          minLength: 1
          type: string
          description: phone number
    cancel_body:
      required:
        - order_id
      type: object
      properties:
        order_id:
          minLength: 1
          type: string
          description: ID of the order in the personal account of the supplier
      description: ''
      x-examples:
        example-1:
          order_id: '1234'
    inline_response_200_3:
      required:
        - penalty
      type: object
      properties:
        penalty:
          $ref: '#/components/schemas/inline_response_200_3_penalty'
      description: ''
      x-examples:
        example-1:
          status: cancelled
          penalty:
            price: 0
            currency: EUR
    inline_response_200_price:
      required:
        - amount
        - currency
      type: object
      properties:
        amount:
          type: number
          description: Price of the offer with upsells
        currency:
          minLength: 1
          type: string
          description: 'Supplier currency in alpha-3 ISO 4217 format, for example EUR'
      description: price data object
    inline_response_200_upsells:
      required:
        - count
        - id
        - max_count
        - price
        - type
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: internal id of additional service
        price:
          type: number
          description: Price of additional service in currency of transfer. Price for the one upsell
        type:
          minLength: 1
          type: string
          description: 'type of service (children_seat_0,children_seat_1, children_seat_2, children_seat_3, bottle_of_water, ski_transportation and other)'
        max_count:
          type: integer
          description: how much can we add of this upsell maximum?
        count:
          type: integer
          description: 'Count of chosen upsells. Count = 0, if type != children_seat_0 / children_seat_1 / children_seat_2 / children_seat_3 '
    inline_response_200_offers:
      required:
        - car_model
        - distance
        - estimated_duration_minutes
        - free_cancel_until
        - gratuity_included
        - id
        - included_waiting_time_minutes
        - luggage_places
        - price
        - seats
        - service_type
        - tolls_included
        - transfer_category
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: id of offer
        estimated_duration_minutes:
          type: integer
          description: estimated travel time in minutes.
        distance:
          type: number
          description: distance in kilometers
        service_type:
          minLength: 1
          type: string
          description: 'transfer, taxi'
        transfer_category:
          $ref: '#/components/schemas/transfer_category'
        car_model:
          minLength: 1
          type: string
          description: for example "Mercedes-Benz E-Class"
        included_waiting_time_minutes:
          type: integer
          description: free waiting time in minutes
        luggage_places:
          type: integer
          description: how many luggage spaces are in the car
        seats:
          type: integer
          description: how many seats are in the car
        children_seat_0:
          type: integer
          description: possible number of seats for a child under a weight of 0-13 kg (from birth to 1 year)
        children_seat_1:
          type: integer
          description: possible number of seats for a child under a weight of 9-18 kg (from 9 months to 4 years)
        children_seat_2:
          type: integer
          description: possible number of seats for a child under a weight of 15-25 kg (from 3 to 7 years old)
        children_seat_3:
          type: integer
          description: possible number of seats for a child under a weight of 22-36 kg (6-12 years old)
        price:
          $ref: '#/components/schemas/inline_response_200_price'
        upsells:
          uniqueItems: true
          type: array
          description: array of objects with additional services that supplier can add
          items:
            $ref: '#/components/schemas/inline_response_200_upsells'
        tolls_included:
          type: boolean
          description: Is tolls included?
        gratuity_included:
          type: boolean
          description: Is gratuity included?
        free_cancel_until:
          minLength: 1
          type: string
          description: 'date when free cancellation ends, example: 2021-11-17T14:09:56.459738+03:00 with TIMEZONE RFC3339. Date in travel time zone'
    inline_response_200_1_price:
      required:
        - amount
        - currency
      type: object
      properties:
        amount:
          type: number
          description: Price of the order with upsells
        currency:
          minLength: 1
          type: string
          description: 'Supplier currency in alpha-3 ISO 4217 format, for example EUR'
      description: price data object
    inline_response_200_1_upsells:
      required:
        - count
        - id
        - price
        - type
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: id of selected upsell
        type:
          minLength: 1
          type: string
          description: 'type of service (children_seat_0,children_seat_1, children_seat_2, children_seat_3, bottle_of_water, ski_transportation and other)'
        count:
          type: integer
          description: count of this upsell
        price:
          type: number
          description: price for the one
    inline_response_200_2_driver_info:
      required:
        - phone
      type: object
      properties:
        first_name:
          minLength: 1
          type: string
          description: 'first name of the driver '
        last_name:
          minLength: 1
          type: string
          description: last name of driver
        phone:
          minLength: 1
          type: string
          description: phone number of driver or carrier
        carrier_company_name:
          type: string
          description: if you don't have info about driver
      description: data driver info object or carrier info
    inline_response_200_2_car_info:
      required:
        - car_model
        - plate_number
      type: object
      properties:
        car_model:
          minLength: 1
          type: string
          description: car model (for example "Mercedes-Benz E-Class")
        plate_number:
          minLength: 1
          type: string
        color:
          minLength: 1
          type: string
          description: color of the car
      description: object with information about car
    transfer_category:
      minLength: 1
      type: string
      description: |-
        category of transfer.
        "economy" - Economy
        "economy_mpv_new" - MPV
        "economy_mpv" - Comfort
        "economy_van" - Minivan
        "minibus" - Minibus
        "business" - Business
        "business_mpv" - Business MPV
        "business_van" - Business Minivan
        "first" - First class
        "micro" - Micro
        "bus" - Bus
        "electro_economy" - Electro Economy
        "electro_economy_mpv" - Electro MPV
        "electro_comfort" - Electro Comfort
        "electro_economy_van" - Electro Minivan
        "electro_minibus" - Electro Minibus
        "electro_business" - Electro Business
        "electro_business_mpv" - Electro Business MPV
        "electro_business_van" - Electro Business Minivan
        "electro_first" - Electro First class
        "electro_micro" - Electro Micro
        "electro_bus" - Electro Bus
      enum:
        - economy
        - economy_mpv_new
        - economy_mpv
        - economy_van
        - minibus
        - business
        - business_mpv
        - business_van
        - first
        - micro
        - bus
        - electro_economy
        - electro_economy_mpv
        - electro_comfort
        - electro_economy_van
        - electro_minibus
        - electro_business
        - electro_business_mpv
        - electro_business_van
        - electro_first
        - electro_micro
        - electro_bus
    meeting_info:
      type: object
      properties:
        instructions:
          type: string
          description: Text instruction of how to find the driver (in English)
        images:
          type: array
          items:
            type: string
          description: Array of urls of images to illustrate the instruction
      description: object with information of how to meet the driver
    inline_response_200_3_penalty:
      required:
        - amount
        - currency
      type: object
      properties:
        amount:
          type: number
          description: cost of the penalty
        currency:
          minLength: 1
          type: string
          description: 'Supplier currency in alpha-3 ISO 4217 format, for example EUR'
      description: 'object with information about the penalty (for example, when the free cancellation period has ended)'
  securitySchemes:
    APIKey1:
      type: http
      scheme: basic

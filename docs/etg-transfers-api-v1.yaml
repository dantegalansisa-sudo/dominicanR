openapi: 3.0.0
info:
  title: Transfers API
  description: |-
    This api is intended for integration with the transfer service. 

    The API is used to search, book, update and cancel transfers. All methods of this API are implemented ON THE SIDE OF THE SUPPLIER. Integration has been implemented by ETG, the supplier needs to implement the methods according to the described interface, and then it will be technically possible for ETG to order transfers from the supplier.

    There is no available test implementation of these methods by ETG.

    Full interaction flow:

    1) ETG searches for transfers by calling the https://supplier.host/search method
    2) A suitable transfer is booked using the https://supplier.host/book method
    3) From time to time there is an automatic update of the status of the order using the https://supplier.host/status method
    4) If the client intends to cancel the transfer, the https://supplier.host/cancel method is called

    For integration with ETG, we expect the implementation of all four methods, providing the address to the corresponding handles (in the /search /book /status /cancel part, the paths are expected to be unchanged) and access keys.

    All methods are expected to authenticate using the http basic auth method.
  version: '1.2'
servers:
  - url: 'https://virtserver.swaggerhub.com/Emerging-Travel/transfers-api/1.1'
    description: SwaggerHub API Auto Mocking
  - url: 'http://supplier.com'
